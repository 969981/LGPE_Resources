name: LGPE Core Icon Validation
on:
  push:
    branches:
      - research/lgpe-unpack-audit-20261126
    paths:
      - LGPE-Research/scripts/verify_core_icons.py
      - LGPE-Research/scripts/audit_image_resources.py
      - LGPE-Research/tests/test_image_resources.py
      - .github/workflows/lgpe-core-icons.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            LGPE-Research/src/lgpe_research
            LGPE-Research/scripts
            LGPE-Research/tests
            LGPE-Research/docs/image-resources/evidence
            1.0.2/2b7730a9e56498bbafac2002d4908c6b_NCA/1/bin/app/icon_item
            1.0.2/2b7730a9e56498bbafac2002d4908c6b_NCA/1/bin/app/icon_type
            1.0.2/2b7730a9e56498bbafac2002d4908c6b_NCA/1/bin/app/icon_pokemon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder dependencies
        run: python -m pip install texture2ddecoder==1.0.6 Pillow==11.3.0
      - name: Test and validate real core archives
        working-directory: LGPE-Research
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest discover -s tests -p test_image_resources.py -v
          python scripts/verify_core_icons.py --report work/core-icon-validation.json
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-icon-validation
          path: LGPE-Research/work/core-icon-validation.json
          if-no-files-found: warn
